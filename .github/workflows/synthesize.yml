# =============================================================================
# synthesize.yml — GitHub Actions workflow: Quartus synthesis for MAX1000
#
# Runs on manual dispatch only.  Checkout and artifact upload happen on the
# ubuntu-latest runner (modern glibc).  Only the Quartus compilation step
# runs inside the raetro/quartus:21.1 Docker container, invoked via
# `docker run` — this avoids the glibc incompatibility that breaks
# actions/checkout when the old Debian Stretch container is used as the
# job container directly.
#
# The program burned into ROM is selectable at synthesis time:
#   - For a manual run (Actions → "Run workflow") pick any .asm from examples/
#     in the "Program" dropdown.  The assembler runs first; no pre-built
#     program.hex needs to be committed.
#
# The CPU clock speed is also selectable via clk_div (default 20):
#   CPU_CLK_DIV_BITS sets the prescaler width.  12 MHz / 2^N:
#     23 → ~1.43 Hz   22 → ~2.86 Hz   21 → ~5.7 Hz
#     20 → ~11.4 Hz   17 → ~91 Hz     14 → ~732 Hz
#
# The artifact is named "quartus-output-<name>" so multiple programs can be
# stored side by side in the same workflow run history.
#
# Outputs:
#   - cpu_fpga.sof  (SRAM programming, volatile)
#   - cpu_fpga.pof  (flash programming, permanent) — if Quartus generates it
#
# To program your board after a successful run:
#   ./build_and_download.sh <name>   (reads clk_div from .asm, downloads artifact)
#   ./program.sh <name>              (flashes the board)
# =============================================================================

name: Quartus Synthesis

on:
  workflow_dispatch:   # manual trigger only
    inputs:
      program:
        description: "Assembly source to burn into ROM (relative to repo root)"
        required: true
        default: "examples/infinite_counter.asm"
        type: string
      name:
        description: "Short name for the program (used to name the artifact, defaults to basename of program without extension)"
        required: false
        default: ""
        type: string
      clk_div:
        description: "CPU_CLK_DIV_BITS — set automatically from '; clk_div: N' in the .asm header. 12 MHz / 2^N."
        required: false
        default: "20"
        type: string
      prog_name:
        description: "Program name shown on OLED (21 chars, padded). Set from '; name: <NAME>' in the .asm header."
        required: false
        default: "UNKNOWN              "
        type: string

jobs:
  synthesis:
    name: Synthesise for MAX1000 (MAX 10)
    runs-on: ubuntu-latest   # modern glibc — needed for actions/checkout Node 20

    steps:
      # -----------------------------------------------------------------------
      # 1. Check out the repository on the runner (not inside the container)
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Assemble the selected program into quartus/program.hex
      # -----------------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # -----------------------------------------------------------------------
      # 2a. Resolve the program path and artifact name from inputs.program.
      #     Accepts bare names (fibonacci), filenames (fibonacci.asm), or
      #     full paths (examples/fibonacci.asm).
      # -----------------------------------------------------------------------
      - name: Resolve program path and artifact name
        id: resolve_name
        run: |
          INPUT="${{ inputs.program }}"
          # Strip leading examples/ and trailing .asm if present
          BARE=$(basename "$INPUT" .asm)
          PROGRAM="examples/${BARE}.asm"
          # Artifact name: use inputs.name if given, otherwise the bare program name
          NAME="${{ inputs.name }}"
          if [ -z "$NAME" ]; then
            NAME="$BARE"
          fi
          echo "Program path: $PROGRAM"
          echo "Effective artifact name: $NAME"
          echo "program=$PROGRAM" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Assemble program into quartus/program.hex
        run: |
          PROGRAM="${{ steps.resolve_name.outputs.program }}"
          echo "Building ROM from: $PROGRAM"
          python3 tools/assembler.py -o quartus/program.hex "$PROGRAM"
          echo "--- quartus/program.hex ---"
          cat quartus/program.hex

      # -----------------------------------------------------------------------
      # 3. Patch CPU_CLK_DIV_BITS in rtl/top.v with the requested clock divider.
      # -----------------------------------------------------------------------
      - name: Patch CPU clock divider in rtl/top.v
        run: |
          CLK_DIV="${{ inputs.clk_div }}"
          echo "Setting CPU_CLK_DIV_BITS = ${CLK_DIV}"
          sed -i "s/^parameter CPU_CLK_DIV_BITS = [0-9]*;/parameter CPU_CLK_DIV_BITS = ${CLK_DIV};/" rtl/top.v
          echo "--- patched line ---"
          grep "^parameter CPU_CLK_DIV_BITS" rtl/top.v

      # -----------------------------------------------------------------------
      # 4. Generate rtl/build_config.vh with the OLED program name.
      #    The name is padded/truncated to exactly 21 characters so the
      #    oled_monitor parameter width (168 bits = 21 × 8) is always correct.
      # -----------------------------------------------------------------------
      - name: Generate rtl/build_config.vh with program name
        run: |
          RAW="${{ inputs.prog_name }}"
          # Pad or truncate to exactly 21 characters
          PROG_NAME=$(printf "%-21.21s" "${RAW}")
          echo "PROG_NAME = \"${PROG_NAME}\""
          cat > rtl/build_config.vh <<EOF
          // build_config.vh — auto-generated by synthesize.yml
          // Do not edit — will be overwritten on every CI build.
          \`define PROG_NAME "${PROG_NAME}"
          EOF
          echo "--- rtl/build_config.vh ---"
          cat rtl/build_config.vh

      # -----------------------------------------------------------------------
      # 5. Run Quartus inside the raetro/quartus:21.1 container via docker run.
      #
      # Why not use `container:` at the job level?
      #   raetro/quartus:21.1 is Debian Stretch (glibc 2.24).  GitHub Actions
      #   now injects Node 20 to run actions, and Node 20 requires glibc 2.25+.
      #   Using docker run for this single step avoids that incompatibility.
      #
      # The workspace is mounted at /workspace inside the container.
      # The QSF uses ../rtl/ paths relative to quartus/ — this works because
      # we cd into /workspace/quartus before running quartus_sh.
      # -----------------------------------------------------------------------
      - name: Run Quartus compilation flow
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            raetro/quartus:21.1 \
            bash -c "cd /workspace/quartus && quartus_sh --flow compile cpu_fpga"

      # -----------------------------------------------------------------------
      # 6. Show a quick summary of what was built
      # -----------------------------------------------------------------------
      - name: Show flow summary
        if: always()
        run: |
          echo "=== Flow report ==="
          cat quartus/output_files/cpu_fpga.flow.rpt || echo "(no flow report)"
          echo ""
          echo "=== Output files ==="
          ls -lh quartus/output_files/ || echo "(no output files)"

      # -----------------------------------------------------------------------
      # 7. Upload the output files as a downloadable artifact.
      #
      # The artifact is named "quartus-output-<name>" so multiple programs
      # can coexist in the same repository's artifact history.
      # Retention: 30 days.
      # -----------------------------------------------------------------------
      - name: Upload output files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quartus-output-${{ steps.resolve_name.outputs.name }}
          path: |
            quartus/output_files/cpu_fpga.sof
            quartus/output_files/cpu_fpga.pof
            quartus/output_files/cpu_fpga.flow.rpt
            quartus/output_files/cpu_fpga.fit.rpt
            quartus/output_files/cpu_fpga.sta.rpt
          retention-days: 30
          if-no-files-found: warn
