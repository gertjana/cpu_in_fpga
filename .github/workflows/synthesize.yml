# =============================================================================
# synthesize.yml — GitHub Actions workflow: Quartus synthesis for MAX1000
#
# Runs on every push to main.  Checkout and artifact upload happen on the
# ubuntu-latest runner (modern glibc).  Only the Quartus compilation step
# runs inside the raetro/quartus:21.1 Docker container, invoked via
# `docker run` — this avoids the glibc incompatibility that breaks
# actions/checkout when the old Debian Stretch container is used as the
# job container directly.
#
# Outputs:
#   - cpu_fpga.sof  (SRAM programming, volatile)
#   - cpu_fpga.pof  (flash programming, permanent) — if Quartus generates it
#
# To program your board after a successful run:
#   1. Download the artifact "quartus-output" from the Actions run
#   2. Unzip it — you get cpu_fpga.sof
#   3. Run:  ./program.sh   (requires openFPGALoader, see README)
# =============================================================================

name: Quartus Synthesis

on:
  push:
    branches:
      - main
    paths:
      - 'rtl/**'
      - 'quartus/**'
      - '.github/workflows/synthesize.yml'
  workflow_dispatch:   # also allow manual trigger from the Actions UI

jobs:
  synthesis:
    name: Synthesise for MAX1000 (MAX 10)
    runs-on: ubuntu-latest   # modern glibc — needed for actions/checkout Node 20

    steps:
      # -----------------------------------------------------------------------
      # 1. Check out the repository on the runner (not inside the container)
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Run Quartus inside the raetro/quartus:21.1 container via docker run.
      #
      # Why not use `container:` at the job level?
      #   raetro/quartus:21.1 is Debian Stretch (glibc 2.24).  GitHub Actions
      #   now injects Node 20 to run actions, and Node 20 requires glibc 2.25+.
      #   Using docker run for this single step avoids that incompatibility.
      #
      # The workspace is mounted at /workspace inside the container.
      # The QSF uses ../rtl/ paths relative to quartus/ — this works because
      # we cd into /workspace/quartus before running quartus_sh.
      # -----------------------------------------------------------------------
      - name: Run Quartus compilation flow
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            raetro/quartus:21.1 \
            bash -c "cd /workspace/quartus && quartus_sh --flow compile cpu_fpga"

      # -----------------------------------------------------------------------
      # 3. Show a quick summary of what was built
      # -----------------------------------------------------------------------
      - name: Show flow summary
        if: always()
        run: |
          echo "=== Flow report ==="
          cat quartus/output_files/cpu_fpga.flow.rpt || echo "(no flow report)"
          echo ""
          echo "=== Output files ==="
          ls -lh quartus/output_files/ || echo "(no output files)"

      # -----------------------------------------------------------------------
      # 4. Upload the output files as a downloadable artifact
      #
      # Retention: 30 days.  Download from:
      #   Actions tab → this run → Artifacts → quartus-output
      # -----------------------------------------------------------------------
      - name: Upload output files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quartus-output
          path: |
            quartus/output_files/cpu_fpga.sof
            quartus/output_files/cpu_fpga.pof
            quartus/output_files/cpu_fpga.flow.rpt
            quartus/output_files/cpu_fpga.fit.rpt
            quartus/output_files/cpu_fpga.sta.rpt
          retention-days: 30
          if-no-files-found: warn
