# =============================================================================
# synthesize.yml — GitHub Actions workflow: Quartus synthesis for MAX1000
#
# Runs on every push to main.  Uses the raetro/quartus:22.1 Docker container
# (x86_64 Linux) which works correctly on GitHub's ubuntu-latest runners.
#
# Outputs:
#   - cpu_fpga.sof  (SRAM programming, volatile)
#   - cpu_fpga.pof  (flash programming, permanent) — if generated by Quartus
#
# To program your board after a successful run:
#   1. Download the artifact "quartus-output" from the Actions run
#   2. Unzip it — you get cpu_fpga.sof
#   3. Run:  ./program.sh   (requires openFPGALoader, see README)
# =============================================================================

name: Quartus Synthesis

on:
  push:
    branches:
      - main
    paths:
      - 'rtl/**'
      - 'quartus/**'
      - '.github/workflows/synthesize.yml'
  workflow_dispatch:   # also allow manual trigger from the Actions UI

jobs:
  synthesis:
    name: Synthesise for MAX1000 (MAX 10)
    runs-on: ubuntu-latest

    # Use the raetro/quartus:22.1 container — native x86_64 Linux, no emulation.
    # This is the same Quartus version as our Dockerfile but runs correctly here.
    container:
      image: raetro/quartus:22.1

    steps:
      # -----------------------------------------------------------------------
      # 1. Check out the repository
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Run full Quartus compilation flow
      #
      # The QSF uses relative paths (../rtl/) from the quartus/ directory.
      # program.hex must be in quartus/ — it is already committed there.
      #
      # Output files land in quartus/output_files/:
      #   cpu_fpga.sof  — SRAM bitstream
      #   cpu_fpga.pof  — flash bitstream (Quartus may or may not generate this)
      # -----------------------------------------------------------------------
      - name: Run Quartus compilation flow
        working-directory: quartus
        run: quartus_sh --flow compile cpu_fpga

      # -----------------------------------------------------------------------
      # 3. Show a quick summary of what was built
      # -----------------------------------------------------------------------
      - name: Show flow summary
        if: always()
        working-directory: quartus
        run: |
          echo "=== Flow report ==="
          cat output_files/cpu_fpga.flow.rpt || echo "(no flow report)"
          echo ""
          echo "=== Output files ==="
          ls -lh output_files/ || echo "(no output files)"

      # -----------------------------------------------------------------------
      # 4. Upload the output files as a downloadable artifact
      #
      # Retention: 30 days (default).  Download from:
      #   Actions tab → this run → Artifacts → quartus-output
      # -----------------------------------------------------------------------
      - name: Upload output files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quartus-output
          path: |
            quartus/output_files/cpu_fpga.sof
            quartus/output_files/cpu_fpga.pof
            quartus/output_files/cpu_fpga.flow.rpt
            quartus/output_files/cpu_fpga.fit.rpt
            quartus/output_files/cpu_fpga.sta.rpt
          retention-days: 30
          if-no-files-found: warn
